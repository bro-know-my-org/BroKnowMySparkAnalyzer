[package]
name = "bkmsa-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the bkmsa Spark analysis core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bkmsa-core.workspace = true
bkmsa-agent = { workspace = true, default-features = false }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.126"

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait = "0.1"
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "RequestRedirect"] }
