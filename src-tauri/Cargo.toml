[package]
name = "bro-know-my-spark-analyzer"
version = "0.1.0"
description = "Local spark report analyzer with configurable AI review"
authors = ["HALO"]
license = "MIT"
edition = "2021"

[lib]
name = "bro_know_my_spark_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bkmsa-core = { path = "../crates/bkmsa-core" }
bkmsa-agent = { path = "../crates/bkmsa-agent", features = ["native-client"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
percent-encoding = "2"
base64 = "0.22"
keyring = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-util = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
