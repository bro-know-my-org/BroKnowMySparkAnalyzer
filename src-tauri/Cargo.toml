[package]
name = "bro-know-my-spark-analyzer"
version = "0.1.0"
description = "Local spark report analyzer with configurable AI review"
authors = ["HALO"]
license = "MIT"
edition = "2021"

[lib]
name = "bro_know_my_spark_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bkmsa-tauri = { path = "../crates/bkmsa-tauri" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
