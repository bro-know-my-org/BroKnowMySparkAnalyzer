name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: bro-know-my-spark-analyzer

jobs:
  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset_os: windows
            arch: x64
          - runner: ubuntu-latest
            asset_os: linux
            arch: x64
          - runner: macos-15-intel
            asset_os: macos
            arch: x64
          - runner: macos-latest
            asset_os: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            wget

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $script = @'
          const fs = require("fs");
          const version = process.env.VERSION;

          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          }

          for (const cargo of ["Cargo.toml", "src-tauri/Cargo.toml"]) {
            const text = fs
              .readFileSync(cargo, "utf8")
              .replace(/^(version\s*=\s*")[^"]+(")/m, `$1${version}$2`);
            fs.writeFileSync(cargo, text);
          }

          const workspace = "Cargo.toml";
          const workspaceText = fs
            .readFileSync(workspace, "utf8")
            .replace(/(bkmsa-core\s*=\s*\{\s*version\s*=\s*")[^"]+("[^\n]*\})/, `$1${version}$2`)
            .replace(/(bkmsa-agent\s*=\s*\{\s*version\s*=\s*")[^"]+("[^\n]*\})/, `$1${version}$2`);
          fs.writeFileSync(workspace, workspaceText);
          '@
          node -e $script

      - name: Build Tauri bundles
        if: runner.os != 'macOS'
        run: pnpm tauri build

      - name: Build Tauri macOS bundles
        if: runner.os == 'macOS'
        continue-on-error: true
        run: pnpm tauri build

      - name: Build bkmsa CLI
        # The preceding step intentionally changes workspace package versions, so Cargo.lock's
        # local package entries are stale until Cargo refreshes them during this build.
        run: cargo build --release -p bkmsa-cli

      - name: Rename release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_OS: ${{ matrix.asset_os }}
          ARCH: ${{ matrix.arch }}
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $prefix = "$env:APP_NAME-$env:VERSION-$env:ASSET_OS-$env:ARCH"
          $cliPrefix = "bkmsa-$env:VERSION-$env:ASSET_OS-$env:ARCH"

          if ($env:ASSET_OS -eq "windows") {
            Copy-Item -LiteralPath "src-tauri/target/release/bro-know-my-spark-analyzer.exe" -Destination "release-assets/$prefix-portable.exe"
            Copy-Item -LiteralPath "target/release/bkmsa.exe" -Destination "release-assets/$cliPrefix.exe"
            $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
            if (-not $setup) { throw "NSIS setup exe was not produced" }
            Copy-Item -LiteralPath $setup.FullName -Destination "release-assets/$prefix-setup.exe"
            $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
            if (-not $msi) { throw "MSI was not produced" }
            Copy-Item -LiteralPath $msi.FullName -Destination "release-assets/$prefix.msi"
          } elseif ($env:ASSET_OS -eq "linux") {
            Copy-Item -LiteralPath "target/release/bkmsa" -Destination "release-assets/$cliPrefix"
            $appimage = Get-ChildItem "src-tauri/target/release/bundle/appimage" -Filter "*.AppImage" | Select-Object -First 1
            if (-not $appimage) { throw "AppImage was not produced" }
            Copy-Item -LiteralPath $appimage.FullName -Destination "release-assets/$prefix.appimage"
            $deb = Get-ChildItem "src-tauri/target/release/bundle/deb" -Filter "*.deb" | Select-Object -First 1
            if (-not $deb) { throw "deb package was not produced" }
            Copy-Item -LiteralPath $deb.FullName -Destination "release-assets/$prefix.deb"
            $rpm = Get-ChildItem "src-tauri/target/release/bundle/rpm" -Filter "*.rpm" | Select-Object -First 1
            if (-not $rpm) { throw "rpm package was not produced" }
            Copy-Item -LiteralPath $rpm.FullName -Destination "release-assets/$prefix.rpm"
          } elseif ($env:ASSET_OS -eq "macos") {
            Copy-Item -LiteralPath "target/release/bkmsa" -Destination "release-assets/$cliPrefix"
            $dmg = Get-ChildItem "src-tauri/target/release/bundle/dmg" -Filter "*.dmg" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dmg) {
              Copy-Item -LiteralPath $dmg.FullName -Destination "release-assets/$prefix.dmg"
            } else {
              Write-Warning "DMG was not produced; skipping macOS release asset."
            }
          }

      - name: Upload required release assets
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload optional macOS release assets
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BroKnowMySparkAnalyzer ${{ steps.version.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
