name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APP_NAME: bro-know-my-spark-analyzer

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          RAW_VERSION="${GITHUB_REF_NAME}"
          [[ "${RAW_VERSION}" == v* ]] || {
            echo "Release tags must start with v" >&2
            exit 1
          }
          VERSION="${RAW_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a stable SemVer release, got ${RAW_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify committed manifest and lock versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          WORKSPACE_VERSIONS="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name | startswith("bkmsa-")) | .version' | sort -u)"
          TAURI_VERSION="$(cargo metadata --locked --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | jq -r '.packages[] | select(.name == "bro-know-my-spark-analyzer") | .version')"
          ROOT_PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          SDK_VERSION="$(node -p 'require("./packages/spark-analyzer/package.json").version')"
          TAURI_CONFIG_VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "${WORKSPACE_VERSIONS}" = "${EXPECTED_VERSION}" || {
            echo "Workspace versions do not all match ${EXPECTED_VERSION}: ${WORKSPACE_VERSIONS}" >&2
            exit 1
          }
          for actual in "${TAURI_VERSION}" "${ROOT_PACKAGE_VERSION}" "${SDK_VERSION}" "${TAURI_CONFIG_VERSION}"; do
            test "${actual}" = "${EXPECTED_VERSION}" || {
              echo "Committed version ${actual} does not match ${EXPECTED_VERSION}" >&2
              exit 1
            }
          done

      - name: Verify an existing release tag targets this commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            test "${TAG_SHA}" = "${GITHUB_SHA}" || {
              echo "Existing tag ${RELEASE_TAG} points to ${TAG_SHA}, not ${GITHUB_SHA}" >&2
              exit 1
            }
          fi

  verify:
    name: Run release CI gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.arch }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset_os: windows
            arch: x64
          - runner: ubuntu-latest
            asset_os: linux
            arch: x64
          - runner: macos-15-intel
            asset_os: macos
            arch: x64
          - runner: macos-latest
            asset_os: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            wget

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        if: runner.os != 'macOS'
        run: pnpm tauri build

      - name: Build Tauri macOS bundles
        if: runner.os == 'macOS'
        continue-on-error: true
        run: pnpm tauri build

      - name: Build bkmsa CLI
        run: cargo build --locked --release -p bkmsa-cli

      - name: Rename release assets
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_OS: ${{ matrix.asset_os }}
          ARCH: ${{ matrix.arch }}
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $prefix = "$env:APP_NAME-$env:VERSION-$env:ASSET_OS-$env:ARCH"
          $cliPrefix = "bkmsa-$env:VERSION-$env:ASSET_OS-$env:ARCH"

          if ($env:ASSET_OS -eq "windows") {
            Copy-Item -LiteralPath "src-tauri/target/release/bro-know-my-spark-analyzer.exe" -Destination "release-assets/$prefix-portable.exe"
            Copy-Item -LiteralPath "target/release/bkmsa.exe" -Destination "release-assets/$cliPrefix.exe"
            $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
            if (-not $setup) { throw "NSIS setup exe was not produced" }
            Copy-Item -LiteralPath $setup.FullName -Destination "release-assets/$prefix-setup.exe"
            $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
            if (-not $msi) { throw "MSI was not produced" }
            Copy-Item -LiteralPath $msi.FullName -Destination "release-assets/$prefix.msi"
          } elseif ($env:ASSET_OS -eq "linux") {
            Copy-Item -LiteralPath "target/release/bkmsa" -Destination "release-assets/$cliPrefix"
            $appimage = Get-ChildItem "src-tauri/target/release/bundle/appimage" -Filter "*.AppImage" | Select-Object -First 1
            if (-not $appimage) { throw "AppImage was not produced" }
            Copy-Item -LiteralPath $appimage.FullName -Destination "release-assets/$prefix.appimage"
            $deb = Get-ChildItem "src-tauri/target/release/bundle/deb" -Filter "*.deb" | Select-Object -First 1
            if (-not $deb) { throw "deb package was not produced" }
            Copy-Item -LiteralPath $deb.FullName -Destination "release-assets/$prefix.deb"
            $rpm = Get-ChildItem "src-tauri/target/release/bundle/rpm" -Filter "*.rpm" | Select-Object -First 1
            if (-not $rpm) { throw "rpm package was not produced" }
            Copy-Item -LiteralPath $rpm.FullName -Destination "release-assets/$prefix.rpm"
          } elseif ($env:ASSET_OS -eq "macos") {
            Copy-Item -LiteralPath "target/release/bkmsa" -Destination "release-assets/$cliPrefix"
            $dmg = Get-ChildItem "src-tauri/target/release/bundle/dmg" -Filter "*.dmg" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dmg) {
              Copy-Item -LiteralPath $dmg.FullName -Destination "release-assets/$prefix.dmg"
            } else {
              Write-Warning "DMG was not produced; skipping macOS release asset."
            }
          }

      - name: Upload required release assets
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload optional macOS release assets
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: warn

  create-release:
    name: Create draft GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Create or verify draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BroKnowMySparkAnalyzer ${{ needs.prepare.outputs.version }}
          draft: true
          generate_release_notes: true

  publish-packages:
    name: Publish SDK packages
    needs: [prepare, build, create-release]
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, publish-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BroKnowMySparkAnalyzer ${{ needs.prepare.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
