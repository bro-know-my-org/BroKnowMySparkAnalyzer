name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WebAssembly packaging tools
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Test system credential storage
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "bkmsa-ci-keyring\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked -p bkmsa-tauri credential_ -- --ignored --nocapture
          '

      - name: Check Tauri shell
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Lint Tauri shell
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check WebAssembly backend
        run: cargo check --locked -p bkmsa-wasm --target wasm32-unknown-unknown

      - name: Build and smoke-test WebAssembly backend
        run: |
          pnpm run build:wasm
          pnpm run test:wasm

      - name: Build UI package
        run: |
          pnpm --dir packages/spark-analyzer build
          pnpm --dir packages/spark-analyzer test
          pnpm --dir packages/spark-analyzer run pack:dry

      - name: Check publishable core package
        run: |
          cargo publish --dry-run --locked -p bkmsa-core
          cargo package --locked -p bkmsa-agent \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"'
          cargo package --locked -p bkmsa-tauri \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"' \
            --config 'patch.crates-io.bkmsa-agent.path="crates/bkmsa-agent"'
          cargo package --locked -p bkmsa-cli \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"' \
            --config 'patch.crates-io.bkmsa-agent.path="crates/bkmsa-agent"'

      - name: Build desktop frontend
        run: pnpm run build

  cross-platform-check:
    name: Check native crates on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Check Rust workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Test system credential storage
        run: cargo test --locked -p bkmsa-tauri credential_ -- --ignored --nocapture

      - name: Check Tauri shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
