name: Publish SDK Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      NPM_TOKEN:
        required: true
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish-crates:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-beta.1, got ${VERSION}" >&2
            exit 1
          fi
          if [[ "${VERSION}" == *-* ]]; then
            IFS='.' read -ra IDENTIFIERS <<< "${VERSION#*-}"
            for identifier in "${IDENTIFIERS[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ && "${identifier}" == 0* && "${identifier}" != "0" ]]; then
                echo "Numeric prerelease identifiers must not contain leading zeroes: ${identifier}" >&2
                exit 1
              fi
            done
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      - name: Verify workspace version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ACTUAL_VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bkmsa-core") | .version')"
          if [[ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "Tag/input version ${EXPECTED_VERSION} does not match workspace version ${ACTUAL_VERSION}" >&2
            exit 1
          fi

      - name: Check package contents
        run: |
          cargo publish --dry-run --locked -p bkmsa-core
          cargo package --locked -p bkmsa-agent \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"'
          cargo package --locked -p bkmsa-tauri \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"' \
            --config 'patch.crates-io.bkmsa-agent.path="crates/bkmsa-agent"'
          cargo package --locked -p bkmsa-cli \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"' \
            --config 'patch.crates-io.bkmsa-agent.path="crates/bkmsa-agent"'

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          publish_with_retry() {
            local crate="$1"
            if cargo info "${crate}@${RELEASE_VERSION}" --registry crates-io >/dev/null 2>&1; then
              echo "${crate} ${RELEASE_VERSION} is already published; skipping"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if cargo publish --locked -p "${crate}"; then
                return 0
              fi
              if cargo info "${crate}@${RELEASE_VERSION}" --registry crates-io >/dev/null 2>&1; then
                echo "${crate} ${RELEASE_VERSION} became available after the publish attempt"
                return 0
              fi
              if [[ "${attempt}" == "5" ]]; then
                echo "Failed to publish ${crate} after ${attempt} attempts" >&2
                return 1
              fi
              sleep $((attempt * 15))
            done
          }

          publish_with_retry bkmsa-core
          publish_with_retry bkmsa-agent
          publish_with_retry bkmsa-tauri
          publish_with_retry bkmsa-cli

  publish-npm:
    name: Publish @bro-know-my/spark-analyzer
    needs: publish-crates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.publish-crates.outputs.version }}
        run: |
          ACTUAL_VERSION="$(node -p 'require("./packages/spark-analyzer/package.json").version')"
          test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}" || {
            echo "Package version ${ACTUAL_VERSION} does not match ${EXPECTED_VERSION}" >&2
            exit 1
          }

      - name: Build package
        run: pnpm --dir packages/spark-analyzer run build

      - name: Check package contents
        run: pnpm --dir packages/spark-analyzer run pack:dry

      - name: Publish package
        working-directory: packages/spark-analyzer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.publish-crates.outputs.version }}
        run: |
          if npm view "@bro-know-my/spark-analyzer@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "npm package ${RELEASE_VERSION} is already published; skipping"
          elif [[ "${RELEASE_VERSION}" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance --tag latest
          fi
