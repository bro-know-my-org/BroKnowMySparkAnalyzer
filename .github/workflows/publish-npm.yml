name: Publish SDK Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-crates:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-beta.1, got ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      - name: Verify workspace version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ACTUAL_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bkmsa-core") | .version')"
          if [[ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "Tag/input version ${EXPECTED_VERSION} does not match workspace version ${ACTUAL_VERSION}" >&2
            exit 1
          fi

      - name: Check package contents
        run: |
          cargo publish --dry-run --locked -p bkmsa-core
          cargo package --locked --no-verify -p bkmsa-agent \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"'
          cargo package --locked --no-verify -p bkmsa-tauri \
            --config 'patch.crates-io.bkmsa-core.path="crates/bkmsa-core"' \
            --config 'patch.crates-io.bkmsa-agent.path="crates/bkmsa-agent"'

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          publish_with_retry() {
            local crate="$1"
            if cargo info "${crate}@${RELEASE_VERSION}" --registry crates-io >/dev/null 2>&1; then
              echo "${crate} ${RELEASE_VERSION} is already published; skipping"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if cargo publish --locked -p "${crate}"; then
                return 0
              fi
              if [[ "${attempt}" == "5" ]]; then
                echo "Failed to publish ${crate} after ${attempt} attempts" >&2
                return 1
              fi
              sleep $((attempt * 15))
            done
          }

          publish_with_retry bkmsa-core
          publish_with_retry bkmsa-agent
          publish_with_retry bkmsa-tauri

  publish-npm:
    name: Publish @bro-know-my/spark-analyzer
    needs: publish-crates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-beta.1, got ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package version from tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "packages/spark-analyzer/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Build package
        run: pnpm --dir packages/spark-analyzer run build

      - name: Check package contents
        run: pnpm --dir packages/spark-analyzer run pack:dry

      - name: Publish package
        working-directory: packages/spark-analyzer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@bro-know-my/spark-analyzer@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "npm package ${RELEASE_VERSION} is already published; skipping"
          else
            npm publish --access public --provenance
          fi
