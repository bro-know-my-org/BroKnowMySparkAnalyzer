[workspace]
resolver = "2"
members = [
  "crates/bkmsa-core",
  "crates/bkmsa-agent",
  "crates/bkmsa-tauri",
  "crates/bkmsa-cli",
  "crates/bkmsa-wasm",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/bro-know-my-org/BroKnowMySparkAnalyzer"

[workspace.dependencies]
bkmsa-core = { version = "0.1.2", path = "crates/bkmsa-core" }
bkmsa-agent = { version = "0.1.2", path = "crates/bkmsa-agent", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
